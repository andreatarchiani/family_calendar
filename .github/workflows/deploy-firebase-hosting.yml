name: Deploy Family Calendar to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test Firestore security rules
        run: npx firebase emulators:exec --only firestore --project demo-family-calendar-test "node scripts/test-firestore-rules.cjs"

      - name: Increment app version for this publication
        id: app-version
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/app/core/config/app-config.ts';
          const content = fs.readFileSync(path, 'utf8');
          const match = content.match(/version:\s*'(\d+)\.(\d+)'/);
          if (!match) throw new Error('Formato versione app non riconosciuto');
          const nextVersion = `${match[1]}.${Number(match[2]) + 1}`;
          fs.writeFileSync(path, content.replace(match[0], `version: '${nextVersion}'`));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${nextVersion}\n`);
          console.log(`Versione per questa pubblicazione: ${nextVersion}`);
          NODE

      - name: Build Angular app
        run: npm run build

      - name: Authenticate for Firebase rules deployment
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          project_id: family-calendar-1e385

      - name: Deploy Firestore security rules
        run: npx firebase deploy --only firestore:rules --project family-calendar-1e385 --non-interactive

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: family-calendar-1e385
          channelId: live

      - name: Save published app version
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/core/config/app-config.ts
          git commit -m "chore: bump app version to v${{ steps.app-version.outputs.version }} [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
