name: Deploy Family Calendar to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test Firestore security rules
        run: npx firebase emulators:exec --only firestore --project demo-family-calendar-test "node scripts/test-firestore-rules.cjs"

      - name: Build Angular app
        run: npm run build

      - name: Authenticate for Firebase rules deployment
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          project_id: family-calendar-1e385

      - name: Deploy Firestore security rules
        run: npx firebase deploy --only firestore:rules --project family-calendar-1e385 --non-interactive

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: family-calendar-1e385
          channelId: live
