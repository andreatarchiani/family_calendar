<header class="app-header">


    <div class="title">

        <mat-icon>
            calendar_month
        </mat-icon>


        <span>
            Family Calendar
        </span>


        <span class="version">
            v{{ appVersion }}
        </span>


    </div>



    <div class="account-area">

        @if(user) {

        <span class="account-name" [style.color]="user.color">

            {{ user.name }}

        </span>

        }


        <button mat-icon-button matTooltip="Logout" (click)="logout()">


            <mat-icon>
                logout
            </mat-icon>


        </button>

    </div>


</header>
